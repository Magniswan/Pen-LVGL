<svg viewBox="0 0 1280 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif; }
      .title { fill: #f8fafc; font-size: 23px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 11px; }
      .region-title { font-size: 11px; font-weight: 700; }
      .name { fill: #f8fafc; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .desc { fill: #94a3b8; font-size: 10px; text-anchor: middle; }
      .note { fill: #cbd5e1; font-size: 10px; }
      .edge-label { fill: #cbd5e1; font-size: 9px; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1280" height="780" fill="#0f172a"/>
  <rect width="1280" height="780" fill="url(#grid)"/>

  <text x="34" y="42" class="title">Y01 / RK3562 GPU、RGA 与 NPU 加速架构</text>
  <text x="34" y="63" class="subtitle">推荐顺序：RGA2 低风险减负  →  DRM + GBM + EGL/GLES 全链路 GPU  →  RKNN 业务推理</text>

  <!-- Region boundaries -->
  <rect x="28" y="92" width="1224" height="120" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="44" y="112" fill="#22d3ee" class="region-title">应用与交互层</text>

  <rect x="28" y="238" width="1224" height="128" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="44" y="258" fill="#34d399" class="region-title">原生服务与渲染编排层</text>

  <rect x="28" y="392" width="1224" height="212" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="44" y="412" fill="#fbbf24" class="region-title">RK3562 硬件加速与内核接口</text>

  <rect x="28" y="630" width="1224" height="100" rx="12" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="44" y="650" fill="#94a3b8" class="region-title">物理设备</text>

  <!-- Arrows behind boxes -->
  <path d="M 230 167 L 230 278" fill="none" stroke="#22d3ee" stroke-width="1.7" marker-end="url(#arrow-cyan)"/>
  <path d="M 1010 167 L 1010 278" fill="none" stroke="#22d3ee" stroke-width="1.7" marker-end="url(#arrow-cyan)"/>
  <path d="M 620 167 L 620 278" fill="none" stroke="#22d3ee" stroke-width="1.7" marker-end="url(#arrow-cyan)"/>

  <path d="M 230 338 L 230 459" fill="none" stroke="#34d399" stroke-width="1.7" marker-end="url(#arrow-emerald)"/>
  <path d="M 620 338 L 620 459" fill="none" stroke="#34d399" stroke-width="1.7" marker-end="url(#arrow-emerald)"/>
  <path d="M 1010 338 L 1010 459" fill="none" stroke="#34d399" stroke-width="1.7" marker-end="url(#arrow-emerald)"/>

  <path d="M 230 523 L 230 557 L 620 557 L 620 539" fill="none" stroke="#fbbf24" stroke-width="1.7" marker-end="url(#arrow)"/>
  <path d="M 620 523 L 620 557" fill="none" stroke="#fbbf24" stroke-width="1.7" marker-end="url(#arrow)"/>
  <path d="M 620 590 L 620 675" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>

  <path d="M 1080 680 L 1080 518" fill="none" stroke="#a78bfa" stroke-width="1.7" marker-end="url(#arrow-violet)"/>
  <path d="M 940 491 L 850 491 L 850 308 L 750 308" fill="none" stroke="#a78bfa" stroke-width="1.7" marker-end="url(#arrow-violet)"/>
  <path d="M 490 308 L 380 308" fill="none" stroke="#34d399" stroke-width="1.7" marker-end="url(#arrow-emerald)"/>
  <path d="M 490 322 L 380 322" fill="none" stroke="#22d3ee" stroke-width="1.7" marker-end="url(#arrow-cyan)"/>

  <!-- Opaque masks and application boxes -->
  <rect x="90" y="126" width="280" height="68" rx="7" fill="#0f172a"/>
  <rect x="90" y="126" width="280" height="68" rx="7" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="230" y="153" class="name">Falcon miniapp</text>
  <text x="230" y="173" class="desc">入口、系统服务、安装升级、账号与网络</text>

  <rect x="480" y="126" width="280" height="68" rx="7" fill="#0f172a"/>
  <rect x="480" y="126" width="280" height="68" rx="7" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="620" y="153" class="name">LVGL 9.5 前台</text>
  <text x="620" y="173" class="desc">控件、动画、触摸、状态机与产品界面</text>

  <rect x="870" y="126" width="280" height="68" rx="7" fill="#0f172a"/>
  <rect x="870" y="126" width="280" height="68" rx="7" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="1010" y="153" class="name">OCR / 语音 / 视觉业务</text>
  <text x="1010" y="173" class="desc">扫描查词、检测识别、分类与轻量语音</text>

  <!-- Service boxes -->
  <rect x="90" y="278" width="280" height="60" rx="7" fill="#0f172a"/>
  <rect x="90" y="278" width="280" height="60" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="230" y="303" class="name">JSAPI / IPC 服务桥</text>
  <text x="230" y="322" class="desc">能力探测、生命周期、错误隔离</text>

  <rect x="480" y="278" width="280" height="60" rx="7" fill="#0f172a"/>
  <rect x="480" y="278" width="280" height="60" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="620" y="303" class="name">C++ 渲染与推理编排</text>
  <text x="620" y="322" class="desc">EGL/RGA/RKNN 适配、缓存、队列与清理</text>

  <rect x="870" y="278" width="280" height="60" rx="7" fill="#0f172a"/>
  <rect x="870" y="278" width="280" height="60" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="1010" y="303" class="name">模型前后处理服务</text>
  <text x="1010" y="322" class="desc">量化输入、零拷贝、解码与结果归一化</text>

  <!-- Accelerator boxes -->
  <rect x="90" y="459" width="280" height="64" rx="7" fill="#0f172a"/>
  <rect x="90" y="459" width="280" height="64" rx="7" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="230" y="485" class="name">RGA2</text>
  <text x="230" y="504" class="desc">旋转、缩放、色彩转换、bitblt、alpha</text>

  <rect x="480" y="459" width="280" height="64" rx="7" fill="#0f172a"/>
  <rect x="480" y="459" width="280" height="64" rx="7" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="620" y="485" class="name">Mali Bifrost GPU</text>
  <text x="620" y="504" class="desc">GBM + EGL + OpenGL ES，纹理与混合</text>

  <rect x="870" y="459" width="280" height="64" rx="7" fill="#0f172a"/>
  <rect x="870" y="459" width="280" height="64" rx="7" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1010" y="485" class="name">RKNPU</text>
  <text x="1010" y="504" class="desc">RKNN Runtime 推理，不参与 LVGL 图形渲染</text>

  <rect x="430" y="557" width="380" height="34" rx="6" fill="#0f172a"/>
  <rect x="430" y="557" width="380" height="34" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="620" y="579" class="name" font-size="11">DRM/KMS + 内核驱动 + DMA-BUF</text>

  <!-- Physical devices -->
  <rect x="480" y="675" width="280" height="40" rx="7" fill="#0f172a"/>
  <rect x="480" y="675" width="280" height="40" rx="7" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="620" y="700" class="name">480 × 960 DSI 显示屏</text>

  <rect x="940" y="660" width="280" height="54" rx="7" fill="#0f172a"/>
  <rect x="940" y="660" width="280" height="54" rx="7" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1080" y="684" class="name">摄像头 / 麦克风</text>
  <text x="1080" y="702" class="desc">图像与音频输入</text>

  <!-- Labels and notes -->
  <text x="230" y="229" class="edge-label">控制、数据与状态</text>
  <text x="620" y="229" class="edge-label">绘制任务</text>
  <text x="1010" y="229" class="edge-label">业务请求</text>
  <text x="230" y="385" class="edge-label">优先验证 RGA</text>
  <text x="620" y="385" class="edge-label">第二阶段 GPU</text>
  <text x="1010" y="385" class="edge-label">独立 NPU 路线</text>
  <text x="868" y="472" class="edge-label">预处理</text>
  <text x="852" y="294" class="edge-label">推理结果</text>

  <rect x="42" y="743" width="1196" height="24" rx="5" fill="rgba(136,19,55,0.35)" stroke="#fb7185" stroke-width="1"/>
  <text x="640" y="760" fill="#fecdd3" font-size="10" text-anchor="middle">固件门槛：必须确认 GPU / RGA / RKNPU 内核节点、用户态库、版本兼容与设备权限；芯片有单元不等于当前固件已启用。</text>
</svg>
